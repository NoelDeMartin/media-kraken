allowBuilds:
    core-js: true
    esbuild: true
    vue-demi: true
catalog:
    '@noeldemartin/solid-utils': next
    '@noeldemartin/utils': next
    'soukai-bis': next
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
overrides:
    '@noeldemartin/solid-utils': 'catalog:'
    '@noeldemartin/utils': 'catalog:'
    soukai-bis: 'catalog:'
    vite: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
minimumReleaseAgeExclude:
    - '@aerogel/*'
    - '@noeldemartin/*'
    - playwright-solid
    - soukai-bis
    - vite-plugin-multi-root-workspace
    - reka-ui@2.12.0
