discover:
    title: 'Discover'

seedCollection:
    title: 'Kickstart'
    description: |
        Ok, if you really don't know where to start I can help you. I understand how intimidating a blank canvas can be!

        Using the button below, I'll add the top 100 rated movies from IMDb to your collection. But after this, you're not getting any more suggestions from me! Ask your friends for recommendations, and every time that you come across something you like, come back to save it. Never forget a movie again!
    submit: 'Add the top 100 rated movies from IMDb to my collection'
    seeding: 'Seeding collection...'

import:
    title: 'Import Media'
    description: 'You can import movies from the following sources:'
    helpForSource: 'Help for {source}'
    importing: 'Importing movies...'
    stop: 'Stop'
    errorDetails: 'Error details'
    invalidFileTitle: 'Invalid file'
    invalidFileDescription: "There was a problem importing that file, are you sure it's in the correct format?"
    imdb:
        name: 'IMDb'
        title: 'Import from IMDb'
        description: 'Introduce a text containing movie URLs from imdb.com and they will be added to your collection.'
        urls: 'Urls'
        noMatches: 'No IMDb movies found'
        placeholder: |
            Examples of valid urls:
            - https://www.imdb.com/title/tt2576852
            - https://m.imdb.com/title/tt2576852
            - https://imdb.com/title/tt2576852
        submit: 'Import'
    netflix:
        name: 'Netflix'
        title: 'Import from Netflix'
        description: |
            You can import the movies you've watched in Netflix by [exporting your viewing history](https://help.netflix.com/en/node/101917).

            Essentially, you'll have to open your [viewing activity](http://www.netflix.com/settings/viewing-history), and download a CSV file.
    custom:
        name: 'Others'
        title: 'Import from other sources'
        description: If you need to import your data from some other service, you simply need to create a CSV using the format below.
        formatDetails: CSV format
        aiInstructions: No idea how to do this? Ask your favorite AI assistant to help you!
        aiInstructionsContent: |
            Help me create a CSV file to import my movie watch history into Media Kraken.

            ## CSV format

            Create a CSV with exactly these column headers: Name, IMDb, Date

            - Name — Required if IMDb is missing. The movie title. Used to search TMDB when no IMDb ID is available.
            - IMDb — Required if Name is missing. The IMDb ID (e.g. tt0137523). Prefer this when the source provides it.
            - Date — Optional. When I watched the movie, using any date format accepted by JavaScript's Date.parse(). If omitted, the movie will be added to watch later.

            Each row is one movie. At least one of Name or IMDb must be filled in per row. Only movies are supported — skip TV shows.

            ## Example

            Name,IMDb,Date
            Spirited Away,tt0245429,2024-03-15
            The Matrix,tt0133093,2024-01-20
            Inception,,2023-12-01

            ## What to do next

            Ask me to provide the data exported from the 3rd party service (e.g. Letterboxd, Plex, Trakt, a personal spreadsheet, etc.). If I don't know how to do it, guide me through the steps to obtain it.
        aiInstructionsCopy: Copy AI instructions
        aiInstructionsCopied: AI instructions copied to clipboard
        csv:
            column: Column
            format: Format
            description: Description
            name: 'Name'
            nameFormat: Required if IMDb is missing
            nameDescription: 'The name of the movie. If the IMDb id is missing, this will be used to search [TMDB](https://www.themoviedb.org/) for a match.'
            date: 'Date'
            dateFormat: Optional
            dateDescription: "The date when you watched the movie, using any standard JavaScript format. If this isn't provided, it will be added to watch later."
            imdb: 'IMDb'
            imdbFormat: Required if Name is missing
            imdbDescription: 'The IMDb ID of the movie.'
